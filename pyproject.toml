[project]
name = "genlayer-api-key-relay-demo"
version = "0.1.0"
description = "A minimal private API-key relay pattern for GenLayer Intelligent Contracts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
